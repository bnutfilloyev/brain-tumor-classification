services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroscan_backend
    restart: always
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    networks:
      - neuronet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroscan_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - neuronet

volumes:
  backend_data:

networks:
  neuronet:
    driver: bridge
